[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"
unreachable_pub = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { priority = -1, level = "warn" }
unwrap_used = "warn"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
too_many_lines = "allow"

# KDFs are unusably slow unoptimized (PBKDF2 runs 1M iterations per check).
[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.ak-passwords]
opt-level = 3
